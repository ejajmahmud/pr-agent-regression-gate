[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-agent-regression-gate"
version = "0.1.0"
description = "Compares baseline vs candidate agent eval runs across pass rate, token cost, and latency for CI merge gates"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
pr-agent-regression-gate = "pr_agent_regression_gate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pr_agent_regression_gate*"]
